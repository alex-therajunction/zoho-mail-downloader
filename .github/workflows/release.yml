name: Release extension zip

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.1.0). Created on main if missing."
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    name: Build zip and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble JSZip
        run: |
          chmod +x scripts/assemble-jszip.sh
          ./scripts/assemble-jszip.sh
          test -s lib/jszip.min.js

      - name: Resolve version tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "Tag must start with v (got: $TAG)" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build Load-unpacked zip
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          STAGE="$(mktemp -d)"
          DEST="$STAGE/zoho-mail-downloader"
          mkdir -p "$DEST"
          for f in manifest.json background.js background-part1.js background-part2.js \
                   content.js popup.html popup.js popup.css README.md BUILD_NOTES.md .gitignore; do
            if [ -f "$f" ]; then cp "$f" "$DEST/"; fi
          done
          mkdir -p "$DEST/lib" "$DEST/scripts"
          cp lib/jszip.min.js "$DEST/lib/"
          cp scripts/assemble-jszip.sh "$DEST/scripts/"
          ZIP_NAME="zoho-mail-downloader-${TAG}.zip"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" zoho-mail-downloader)
          ls -la "$ZIP_NAME"
          unzip -l "$ZIP_NAME" | head -40

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Chrome extension (Manifest V3) — Load-unpacked ready zip.

            1. Download `zoho-mail-downloader-${{ steps.ver.outputs.tag }}.zip`
            2. Unzip
            3. Chrome → `chrome://extensions` → Developer mode → **Load unpacked** → select the `zoho-mail-downloader` folder
            4. Sign in at https://mail.zoho.com/zm/ before using

            `lib/jszip.min.js` is already assembled in this zip (no extra script step).
          files: zoho-mail-downloader-${{ steps.ver.outputs.tag }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
